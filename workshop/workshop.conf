# Workshop settings - filled in ONCE by the facilitator before the session.
# setup_workshop.sh refuses to run while any value is still CHANGE_ME, so
# students get a clear "ask your facilitator" message instead of a confusing
# Slurm error. See README.md, "Before the session", for where each value comes from.

# Slurm account students charge GPU time to. On Delta, `accounts` lists yours;
# GPU accounts end in -delta-gpu (e.g. abcd-delta-gpu).
WORKSHOP_ACCOUNT="CHANGE_ME"

# Reservation name from the NCSA ticket (`scontrol show res` once it exists).
# Set to "" for dry runs before the reservation is active.
WORKSHOP_RESERVATION="CHANGE_ME"

# Partition the reservation's nodes are in.
WORKSHOP_PARTITION="gpuA100x4"

# Model key from `llmflux show-models`. Qwen2.5-7B-Instruct is ungated (no
# HuggingFace token needed), fits on one A100, and follows JSON instructions well.
WORKSHOP_MODEL="Qwen2.5-7B-Instruct"

# Walltime per student job. The default task file finishes in a few minutes
# once the model is loaded; this is a ceiling, not a target.
WORKSHOP_TIME="00:20:00"

# Shared, pre-downloaded HuggingFace cache that every student job reads
# weights from. Leave "" and each student downloads ~15 GB into their own
# workspace - slow, and a lot of load on the filesystem with a full room.
WORKSHOP_HF_HOME="CHANGE_ME"

# Directory holding a prebuilt llm_processor.sif container image that every
# student uses. Leave "" if `module show llmflux` already sets
# LLMFLUX_CONTAINERS_DIR. If neither is set, each student's first `llmflux run`
# BUILDS the container on the login node - minutes of work, times a full room.
WORKSHOP_CONTAINERS_DIR=""

# Module that provides llmflux on the cluster. "" if llmflux is already on PATH.
WORKSHOP_MODULE="llmflux"

# Optional: directory with a results file from the facilitator's dry run,
# copied to each student's sample_results/ so they have something to look at
# while their own job is queued. "" to skip.
WORKSHOP_SAMPLE_RESULTS=""
