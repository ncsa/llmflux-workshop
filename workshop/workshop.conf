# Workshop settings - filled in ONCE by the facilitator, in the shared copy on
# the cluster. Never commit real account or reservation names to the repo.
# setup_workshop.sh refuses to run while any value is still CHANGE_ME, so
# participants get a clear "ask your facilitator" message instead of a confusing
# Slurm error. See facilitator/README.md, "Before the session".
#
#                    Delta                          DeltaAI
#   System           delta                          deltaai
#   GPUs             NVIDIA A100 (x86)              NVIDIA GH200 Grace Hopper (ARM)
#   Partition        gpuA100x4                      ghx4
#   GPU account      xxxx-delta-gpu                 xxxx-dtai-gh
#   SSH login        login.delta.ncsa.illinois.edu  dtai-login.delta.ncsa.illinois.edu
#   Open OnDemand    openondemand.delta...          gh-ondemand.delta...

# Which cluster the reservation is on: "delta" or "deltaai". The scripts refuse
# to run if a participant is logged in to the other one.
WORKSHOP_SYSTEM="CHANGE_ME"

# Slurm account participants charge GPU time to (`accounts` lists yours).
WORKSHOP_ACCOUNT="CHANGE_ME"

# Reservation name from the NCSA ticket (`scontrol show res` once it exists).
# Set to "" for dry runs before the reservation is active.
WORKSHOP_RESERVATION="CHANGE_ME"

# Partition the reservation's nodes are in (see the table above).
WORKSHOP_PARTITION="CHANGE_ME"

# Model key from `llmflux show-models`. Qwen2.5-7B-Instruct is ungated (no
# HuggingFace token needed), fits on one GPU, and follows JSON instructions well.
WORKSHOP_MODEL="Qwen2.5-7B-Instruct"

# Default sample data for make_prompts.py: "general" (16 abstracts across
# disciplines) or "genomics" (16 genomics abstracts). Participants can still
# pick either with --dataset.
WORKSHOP_DATASET="general"

# Walltime per participant job. The default task file finishes in a few minutes
# once the model is loaded; this is a ceiling, not a target.
WORKSHOP_TIME="00:20:00"

# Shared, pre-downloaded HuggingFace cache that every job reads weights from.
# The weights are the same on both systems, so one cache can serve either.
# Leave "" and each participant downloads ~15 GB into their own workspace -
# slow, and a lot of load on the filesystem with a full room.
WORKSHOP_HF_HOME="CHANGE_ME"

# Directory holding a prebuilt llm_processor.sif container image that every
# participant uses. Leave "" if `module show llmflux` already sets
# LLMFLUX_CONTAINERS_DIR. A container built on one system does NOT run on the
# other (x86 vs ARM), so this must be the image for WORKSHOP_SYSTEM. If neither
# is set, each participant's first `llmflux run` BUILDS the container on the
# login node - minutes of work, times a full room.
WORKSHOP_CONTAINERS_DIR=""

# Module that provides llmflux on the cluster. "" if llmflux is already on PATH.
WORKSHOP_MODULE="llmflux"

# Optional: directory with a results file from the facilitator's dry run,
# copied to each participant's sample_results/ so they have something to look
# at while their own job is queued. "" to skip.
WORKSHOP_SAMPLE_RESULTS=""
